# Локальна розробка. Команди виконуються одноразовими контейнерами
# (`docker compose run --rm app …`); worker — `run.cmd worker` / `./run.sh worker`.
# Telegram API: TELEGRAM_API_ID / TELEGRAM_API_HASH у .env (не комітиться).
# PostgreSQL — як у crypto-bot (postgres:16-alpine); порт на хості за замовчуванням 5433,
# щоб не конфліктувати з базою crypto-bot на 5432.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_digest}
      POSTGRES_USER: ${POSTGRES_USER:-news_digest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_digest}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news_digest} -d ${POSTGRES_DB:-news_digest}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build:
      context: .
      target: dev
    image: local/newsdigest:dev
    environment:
      TZ: Europe/Kyiv
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-news_digest}
      POSTGRES_USER: ${POSTGRES_USER:-news_digest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news_digest}
      # У контейнері тести БД мають падати, а не пропускатися, якщо база недоступна.
      NEWSDIGEST_REQUIRE_DB: "1"
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      NEWSDIGEST_STATE_DIR: /state
      NEWSDIGEST_CACHE_DIR: /cache
      NEWSDIGEST_SESSION_DIR: /session
    volumes:
      # Код монтується поверх образу: зміни видно без перезбірки.
      # Віртуальне оточення лежить у /opt/venv і монтуванням не перекривається.
      - ./src:/app/src
      - ./tests:/app/tests
      - ./config:/app/config
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./state:/state
      - ./cache:/cache
      - ./session:/session
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
