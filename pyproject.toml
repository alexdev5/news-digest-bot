[project]
name = "newsdigest"
version = "0.1.0"
description = "Тематичні дайджести з Telegram-каналів і сайтів"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.14",
    "openai>=1.60",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9,<3",
    "qrcode>=7.4",
    "sqlalchemy>=2.0.36",
    "telethon>=1.40",
    "typer>=0.12",
    "tzdata>=2024.1",
]

[project.scripts]
digest = "newsdigest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsdigest"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Українські тексти містять кириличні символи, схожі на латинські.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*", "qrcode", "qrcode.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
