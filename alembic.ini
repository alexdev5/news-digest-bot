# Для ручних команд розробника (`alembic revision --autogenerate -m "..."`).
# Застосунок мігрує БД сам через `digest migrate`, без цього файлу.
# URL береться зі змінних POSTGRES_* (див. .env.example).
[alembic]
script_location = %(here)s/src/newsdigest/storage/migrations
prepend_sys_path = src
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
