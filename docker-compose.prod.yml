# Production-стек NewsDigest на сервері (/srv/news-digest): окремий Docker-проєкт
# `news-digest` із двома контейнерами — власний PostgreSQL (`db`) і бот (`app`).
# Від crypto-bot не залежить: своя мережа, свій том, свій пароль (D-023).
#
# Сервіс `app` (worker `digest run`) має profile `worker`: його запускає
# deploy/deploy.sh лише після `digest login` і заповнених Telegram-секретів, щоб
# контейнер не крутився в restart-циклі без сесії. `up -d` без profile — лише `db`.
name: news-digest

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news_digest}
      POSTGRES_USER: ${POSTGRES_USER:-news_digest}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    # Порт навмисно не публікується: базу бачить лише `app` у мережі цього проєкту.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    build:
      context: .
      target: runtime
    image: local/newsdigest:prod
    profiles: ["worker"]
    command: ["digest", "run", "--config", "/config/config.json"]
    restart: unless-stopped
    environment:
      TZ: Europe/Kyiv
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-news_digest}
      POSTGRES_USER: ${POSTGRES_USER:-news_digest}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TELEGRAM_API_ID_FILE: /run/secrets/telegram_api_id
      TELEGRAM_API_HASH_FILE: /run/secrets/telegram_api_hash
      NEWSDIGEST_STATE_DIR: /state
      NEWSDIGEST_CACHE_DIR: /cache
      NEWSDIGEST_SESSION_DIR: /session
    depends_on:
      db:
        condition: service_healthy
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ./config:/config:ro
      - ./cache:/cache
      - ./state:/state
      - ./session:/session
    tmpfs:
      - /tmp:size=64m,mode=1777
    secrets:
      - postgres_password
      - telegram_api_id
      - telegram_api_hash
    healthcheck:
      test: ["CMD", "digest", "healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    stop_grace_period: 60s
    logging: *default-logging

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  telegram_api_id:
    file: ./secrets/telegram_api_id
  telegram_api_hash:
    file: ./secrets/telegram_api_hash

volumes:
  pgdata:
